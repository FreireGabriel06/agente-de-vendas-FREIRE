# Public website plus one isolated instance per client, behind Caddy, which
# obtains and renews the HTTPS certificates by itself (Let's Encrypt).
#
#   cd deploy
#   python preencher_site.py           # writes site-pronto/ from the template
#   docker compose up -d --build
#
# Add a client: python3 novo_cliente.py (writes docker-compose.override.yml
# and clientes-caddy/, both ignored by git).
name: agente

services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    # Só o que o Caddy precisa: abrir as portas 80 e 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no arquivo deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site-pronto:/srv/site:ro
      - ./clientes-caddy:/etc/caddy/clientes:ro
      - caddy_dados:/data
      - caddy_config:/config
    networks:
      interna:
        ipv4_address: 172.30.0.2

  cliente1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Sem privilégio nenhum, disco da imagem só de leitura (grava só em
    # /dados e em /tmp, que some ao reiniciar) e limites de memória e de
    # processos: uma instância com problema não derruba as outras.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 768m
    pids_limit: 256
    env_file: instancias/cliente1.env
    environment:
      # Only Caddy, at this fixed address, may set X-Forwarded-Proto.
      PROXY_IPS: 172.30.0.2
    volumes:
      - dados_cliente1:/dados
    networks:
      - interna

volumes:
  caddy_dados:
  caddy_config:
  dados_cliente1:

networks:
  interna:
    ipam:
      config:
        - subnet: 172.30.0.0/24
